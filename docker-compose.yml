# Infrastructure (postgres, redis) starts by default:   docker compose up -d --wait
# Full stack (adds migrate, api, web, worker):          docker compose --profile app up --build
name: nexus

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: nexus
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies Prisma migrations, then exits. API and workers wait for it.
  migrate:
    profiles: [app]
    image: ${NEXUS_IMAGE_REGISTRY:-ghcr.io/ntumba9}/nexus-api:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', '--filter', '@nexus/database', 'migrate:deploy']
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    profiles: [app]
    image: ${NEXUS_IMAGE_REGISTRY:-ghcr.io/ntumba9}/nexus-api:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # The web container proxies browser requests to the API: trust exactly one hop for client IPs.
      TRUST_PROXY_HOPS: 1
      # NODE_ENV=production defaults cookies to Secure, which needs HTTPS. Set true behind TLS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      MONITORING_ALLOW_PRIVATE_NETWORKS: ${MONITORING_ALLOW_PRIVATE_NETWORKS:-false}
      # Passed through only when set in .env (a bare name; an empty value would fail validation), so
      # the defaults in packages/config apply otherwise. The api and the worker must agree on the
      # embedding and AI settings.
      EMBEDDING_PROVIDER:
      EMBEDDING_API_URL:
      EMBEDDING_MODEL:
      EMBEDDING_API_KEY:
      AI_PROVIDER:
      AI_API_URL:
      AI_MODEL:
      AI_VENDOR:
      AI_API_KEY:
      METRICS_TOKEN:
      API_RATE_LIMIT_PER_MINUTE:
      REGISTRATION_ENABLED:
      REALTIME_HEARTBEAT_MS:
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    profiles: [app]
    image: ${NEXUS_IMAGE_REGISTRY:-ghcr.io/ntumba9}/nexus-web:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      # Passed through only when set in .env. REGISTRATION_ENABLED must match the api's.
      REGISTRATION_ENABLED:
      DEMO_LOGIN_EMAIL:
      DEMO_LOGIN_PASSWORD:
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    profiles: [app]
    image: ${NEXUS_IMAGE_REGISTRY:-ghcr.io/ntumba9}/nexus-worker:${NEXUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: workers/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_HEALTH_PORT: 3002
      # Off by default: monitoring must not be able to probe the network the platform runs in.
      MONITORING_ALLOW_PRIVATE_NETWORKS: ${MONITORING_ALLOW_PRIVATE_NETWORKS:-false}
      MONITORING_RESULT_RETENTION_DAYS: ${MONITORING_RESULT_RETENTION_DAYS:-30}
      # Automation and notifications. The key is the same one the API uses: it decrypts the
      # signing secrets of outbound webhooks. `log` writes emails to the worker log; `smtp` sends them.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: '${EMAIL_FROM:-NEXUS <nexus@localhost>}'
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Passed through only when set in .env; see the api service above.
      EMBEDDING_PROVIDER:
      EMBEDDING_API_URL:
      EMBEDDING_MODEL:
      EMBEDDING_API_KEY:
      AI_PROVIDER:
      AI_API_URL:
      AI_MODEL:
      AI_VENDOR:
      AI_API_KEY:
      METRICS_TOKEN:
      MONITORING_DISPATCH_INTERVAL_MS:
      WEBHOOK_RETENTION_DAYS:
      AUTOMATION_DISPATCH_INTERVAL_MS:
      AUTOMATION_MAX_EXECUTIONS_PER_RULE_PER_HOUR:
      AUTOMATION_RETENTION_DAYS:
      NOTIFICATION_RETENTION_DAYS:
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
