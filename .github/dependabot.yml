# Keeps dependencies current, so security fixes arrive as pull requests instead of being noticed late.
# Related updates are grouped so a week's worth is one PR, not twenty.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The runtime is Node 22 (the pinned LTS). Its type definitions move with it, as one deliberate
      # change that also updates .nvmrc, engines, CI and the Dockerfiles, not one major at a time.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /workers]
    schedule:
      interval: monthly
    ignore:
      # Same reason: Node is changed on purpose, to the next LTS, not to whatever release is newest
      # (Node 25 is a short-lived line). Minor and patch updates of the Node 22 image still arrive.
      - dependency-name: node
        update-types: ['version-update:semver-major']
