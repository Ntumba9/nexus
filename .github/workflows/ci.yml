name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any known high or critical advisory in what actually ships (production dependencies).
      # A transitive one is fixed with a `pnpm.overrides` entry in package.json, with a note saying why.
      - run: pnpm audit --prod --audit-level high

  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: nexus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:ci_password@localhost:5432/nexus
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      # Runs every test (unit and integration) with coverage, and fails below the floors set in each
      # package's vitest.config.ts.
      - run: pnpm test:coverage

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: nexus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:ci_password@localhost:5432/nexus
      REDIS_URL: redis://localhost:6379
      # Tests register many users from one IP; production defaults would (correctly) throttle them.
      AUTH_RATE_LIMIT_MAX: '1000'
      # The monitoring E2E watches a service on 127.0.0.1, which is refused unless the operator opts in.
      MONITORING_ALLOW_PRIVATE_NETWORKS: 'true'
      MONITORING_DISPATCH_INTERVAL_MS: '1000'
      # Enables GitHub integrations. A throwaway key for CI only; it protects nothing.
      INTEGRATION_ENCRYPTION_KEY: 'Y2ktb25seS1rZXktMzItYnl0ZXMtbG9uZy1vaw0hSAI='
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate:deploy
      - run: pnpm --filter @nexus/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @nexus/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose --profile app config --quiet
      - name: Validate the production overlay and Caddyfile
        run: |
          export POSTGRES_PASSWORD=ci WEB_ORIGIN=https://nexus.example.com SITE_ADDRESS=nexus.example.com
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app config --quiet
          # Only Caddy may publish ports in production.
          published=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app config --format json             | python3 -c "import sys,json; c=json.load(sys.stdin)['services']; print(' '.join(sorted(n for n,s in c.items() if s.get('ports'))))")
          test "$published" = "caddy" || { echo "Services publishing ports: $published"; exit 1; }
          docker run --rm -e SITE_ADDRESS=nexus.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"             caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build images
        run: docker compose --profile app build
